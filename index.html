<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الرياضيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@600&family=Caveat:wght@500&family=Playpen+Sans+Arabic:wght@400;500&family=Cairo:wght@500&family=Amiri:wght@400&family=Aref+Ruqaa:wght@400&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f6fb;--grid:#dde6f1;--ink:#14213d;--mut:#5b6b86;--card:#fff;--line:#d3dcea;--hi:#ffc93c;--ok:#1f8a7d;--bad:#d9573b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--grid:#17233a;--ink:#eaf0fa;--mut:#9fb0cb;--card:#16213a;--line:#2a3a5a;--ok:#3fc4b3;--bad:#f08466}}
:root[data-theme="dark"]{--bg:#0e1626;--grid:#17233a;--ink:#eaf0fa;--mut:#9fb0cb;--card:#16213a;--line:#2a3a5a;--ok:#3fc4b3;--bad:#f08466}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:'Reem Kufi',Tajawal,sans-serif;font-weight:600;margin:0}
h1{font-size:1.7rem}h2{font-size:1.2rem;margin:18px 0 8px;display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 12px}.panel h2{background:none;border:0;padding:0;display:block}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.logo{width:60px;height:60px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-family:'Reem Kufi';font-size:1.5rem}
.gear{margin-inline-start:auto;font:inherit;background:none;border:1.5px solid var(--line);color:var(--mut);border-radius:10px;padding:6px 12px;cursor:pointer}
.mark{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
.prog,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.row{display:flex;gap:8px;margin-bottom:8px}
.lesson{flex:1;display:flex;align-items:center;gap:12px;text-align:right;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.lesson:hover{border-color:var(--ink)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.dot.on{background:var(--ok);border-color:var(--ok)}
.sm{font:inherit;font-size:.9rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer}
.back{font:inherit;background:none;border:0;color:var(--mut);cursor:pointer;padding:0;margin-bottom:10px}
.txt{font-size:1.1rem;max-width:60ch;white-space:pre-wrap}
.q{margin-top:18px;font-weight:700}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.msg{min-height:1.7em;margin-top:10px;font-weight:700}
.ai{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.ai button{font:inherit;margin-left:8px;padding:6px 12px;border-radius:16px;border:1.5px solid var(--ink);background:var(--hi);color:#14213d;cursor:pointer}
.ai p{margin:10px 0 0}.note{font-size:.85rem;color:var(--mut)}
.next,.go{font:inherit;margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
label{display:block;font-weight:500;margin-top:10px;font-size:.95rem}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.sm[aria-pressed=true]{background:var(--ink);color:var(--bg)}input[type=color]{height:42px;padding:3px}
.hero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}.hero img{display:block;width:100%;max-height:340px;object-fit:cover;object-position:center 15%}.cap{position:absolute;inset-inline:0;bottom:0;padding:32px 14px 10px;background:linear-gradient(transparent,rgba(10,20,45,.85));color:#fff;display:flex;flex-direction:column}.cap b{font-family:"Reem Kufi",Tajawal,sans-serif;font-size:1.25rem}.cap span{font-size:.95rem;opacity:.9}
.vd{position:relative;aspect-ratio:16/9;margin-top:12px;border-radius:12px;overflow:hidden;background:#000}.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.note a{color:var(--ink)}
.lb{display:inline-block;padding:8px 16px;border-radius:20px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:500}.lb:has(b){background:var(--hi);color:#14213d}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.ib:hover{opacity:.85}.sw{align-items:center}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.gb{font-family:'Reem Kufi',Tajawal,sans-serif;font-size:1.15rem;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px 10px;cursor:pointer}.gb:hover{background:var(--hi);color:#14213d}.reg{display:block;text-align:center;padding:14px;border-radius:14px;background:var(--hi);color:#14213d;font-weight:700;font-size:1.1rem;text-decoration:none;border:1.5px solid var(--ink)}
input[type=range]{padding:0}
.bio{margin:0;font-family:Caveat,'Playpen Sans Arabic',cursive;font-weight:500;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--bgi,none);background-size:cover;background-position:var(--bgp,50% 50%);transform:var(--bgt,none)}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--hi) 35%,transparent)}
</style>
</head>
